<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martynas Loveikis</title>
  <link rel="stylesheet" href="header_styling.css">
</head>
<body>
  <svg class="header-svg" viewBox="0 0 115 25" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
      <filter id="goo" class="goo-filter">
        <feGaussianBlur in="SourceGraphic" result="blur" />
        <feColorMatrix in="blur" mode="matrix" result="goo" />
        <feBlend in="SourceGraphic" in2="goo" />
      </filter>
      <path id="wave" d="M 0,10 C 30,10 30,15 60,15 90,15 90,10 120,10 150,10 150,15 180,15 210,15 210,10 240,10 v 28 h -240 z" />
    </defs>

    <rect class="top-line" x="0" y="1" width="100%" height="0.4"></rect>
    <use id="wave3" class="wave" xlink:href="#wave" x="0" y="-2"></use>
    <use id="wave2" class="wave" xlink:href="#wave" x="0" y="0"></use>
    <use id="wave1" class="wave" xlink:href="#wave" x="0" y="1"></use>

    <rect class="headerRect" width="85" height="7.3" rx="1" x="15" y="16.8"></rect>

  <path id="nameTyping">
    <animate attributeName="d" from="m25,-6 h0" to="m25,-6 h70" dur="1s" begin="0s" fill="freeze"/>
  </path>
  <text font-family="Courier New" font-size=".22em" fill="black"
        font-weight="bold" letter-spacing="2" text-anchor="middle" dominant-baseline="central">
    <textPath xlink:href="#nameTyping" startOffset="50%">
      MARTYNAS LOVEIKIS
    </textPath>
  </text>

    <path id="descriptionTyping">
      <animate attributeName="d" from="m30,-3 h0" to="m30,-3 h100" dur="2s" begin="0s" fill="freeze"/>
    </path>
    <text x="53" class="description-text">
      <textPath xlink:href="#descriptionTyping">
        Industrial controls engineer, Data Science &amp; AI graduate
      </textPath>
    </text>
  </svg>
</body>
</html>
